services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: food_search
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - foodscope_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  foodscope_mysql:
